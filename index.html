<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyRoom · 自习手账</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
</head>
<body>
<!-- 导航栏 -->
<nav class="nav-bar">
  <button class="nav-tab active" data-view="home">今日首页</button>
  <button class="nav-tab" data-view="plan">计划总览</button>
  <button class="nav-tab" data-view="stats">数据统计</button>
  <button class="nav-tab" data-view="course">科目管理</button>
  <button class="nav-tab" data-view="calendar">日历打卡</button>
  <div class="nav-right">
    <button id="openReviewBtn">复盘小结</button>
    <button id="openSetting">偏好设置 ⚙</button>
  </div>
</nav>

<!-- 首页 view-home -->
<div class="view" id="view-home">
  <div class="container">
    <div class="clock-wrap">
      <div id="liveClockTime"></div>
      <div id="liveClockDate"></div>
    </div>
    <div id="totalProgress"></div>

    <!-- 图表区域 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;">
      <div style="height:240px">
        <canvas id="homeChartRing"></canvas>
      </div>
      <div style="height:240px">
        <canvas id="homeChartStack"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>番茄专注</h3>
      <div id="pomTime">25:00</div>
      <div id="pomHint"></div>
      <div class="btn-row">
        <button id="pomStart">开始专注</button>
        <button id="pomReset">重置</button>
      </div>
    </div>

    <div class="card">
      <div class="flex-row">
        <h3>今日任务</h3>
        <button id="toggleQuickTask">新增任务</button>
      </div>
      <div id="quickTaskBox" style="display:none;gap:8px;margin:8px 0;flex-wrap:wrap;">
        <input type="text" id="quickTaskTitle" placeholder="任务名称">
        <input type="number" id="quickTaskMin" placeholder="预估分钟" value="30">
        <button id="addQuickTaskBtn">添加</button>
      </div>
      <div id="taskList"></div>
      <div id="taskEmpty" style="color:#888;display:none;">暂无任务</div>
    </div>

    <div class="card">
      <div class="flex-row">
        <h3>待考科目</h3>
        <button id="quickAddCourseFromHome">添加科目</button>
      </div>
      <div id="courseGrid"></div>
      <div id="courseEmptyHint" style="color:#888;display:none;">暂未启用科目</div>
    </div>
  </div>
</div>

<!-- 计划总览 -->
<div class="view" id="view-plan" style="display:none;">
  <div class="container">
    <div class="card">
      <h3>整体计划</h3>
      <p>可以在这里自由安排复习顺序</p>
    </div>
  </div>
</div>

<!-- 数据统计 -->
<div class="view" id="view-stats" style="display:none;">
  <div class="container">
    <div class="card">
      <h3>28天打卡热力图</h3>
      <div id="heatmapGrid" style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px;"></div>
    </div>
    <div class="card">
      <div class="flex-row">
        <h3>7天专注趋势</h3>
        <button id="toggleTrendBtn">展开/收起</button>
      </div>
      <div id="trendCardBody">
        <div style="height:280px;margin:16px 0;">
          <canvas id="chartTrend"></canvas>
        </div>
      </div>
    </div>
    <div class="card" id="homeStatsCard">
      <p>点击返回首页</p>
    </div>
  </div>
</div>

<!-- 科目管理 -->
<div class="view" id="view-course" style="display:none;">
  <div class="container">
    <div class="flex-row">
      <h3>科目列表</h3>
      <button id="addCourseFromCourses">新增科目</button>
    </div>
    <div id="courseGrid"></div>
  </div>
</div>

<!-- 日历打卡 -->
<div class="view" id="view-calendar" style="display:none;">
  <div class="container">
    <div class="card">
      <div class="flex-row">
        <button id="calPrev">←</button>
        <h3 id="calTitle"></h3>
        <button id="calNext">→</button>
      </div>
      <div id="calSummary"></div>
      <div id="calGrid" class="calendar-grid"></div>
    </div>
  </div>
</div>

<!-- 弹窗容器 -->
<div id="modalContainer" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h4 id="modalTitle"></h4>
      <button id="modalClose">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- 桌宠挂件 -->
<div id="petContainer" class="pet">
  <img id="petImg">
  <div id="petTimer"></div>
</div>

<script src="app.js"></script>
</body>
</html>
